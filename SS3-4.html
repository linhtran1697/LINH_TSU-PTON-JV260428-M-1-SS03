<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        td {
            border: 1px solid black;
            padding: 15px 25px;
            text-align: center;
            font-size: 18px;
            /* Tạo khoảng cách giữa các ô giống như hình */
            margin: 10px;
            display: table-cell;
        }

        /* Thêm khoảng cách giữa các hàng và cột bằng cách dùng border-spacing */
        table {
            border-collapse: separate;
            border-spacing: 15px; /* Điều chỉnh độ rộng khe hở giữa các ô */
            border: 1px solid #ccc; /* Khung viền ngoài cùng */
        }
        
        .header {
            font-weight: bold;
        }
    </style>
</head>
<body>
   <table>
    <!-- Hàng tiêu đề -->
    <tr class="header">
        <td>Tên</td>
        <td>Tuổi</td>
        <td>Nghề nghiệp</td>
    </tr>
    <!-- Dữ liệu -->
    <tr>
        <td>An</td>
        <td>25</td>
        <td>Lập trình viên</td>
    </tr>
    <tr>
        <td>Bảo</td>
        <td>30</td>
        <td>Kỹ sư xây dựng</td>
    </tr>
    <tr>
        <td>Chi</td>
        <td>22</td>
        <td>Sinh viên</td>
    </tr>
</table>
</table>
</body>
</html>
