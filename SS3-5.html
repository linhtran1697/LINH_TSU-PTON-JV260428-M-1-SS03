<!DOCTYPE html>
<html>
<head>
<style>
  table {
    border: 1px solid black;
    border-collapse: separate;
    border-spacing: 15px; /* Tạo khoảng cách giữa các ô */
    text-align: center;
    font-family: Arial, sans-serif;
  }
  
  th, td {
    border: 1px solid black;
    padding: 15px 25px;
    min-width: 150px;
  }

  .header-main {
    font-weight: bold;
    font-size: 1.2em;
  }
</style>
</head>
<body>

<table>
  <tr>
    <th class="header-main">Tháng</th>
    <th colspan="2" class="header-main">Tỷ lệ đơn hàng theo tháng</th>
  </tr>
  <tr>
    <td>Nguyễn Văn A</td>
    <td>15% hoàn thành</td>
    <td>85% hủy hàng</td>
  </tr>
  <tr>
    <td>Phan Văn B</td>
    <td>25% hoàn thành</td>
    <td>75% hủy hàng</td>
  </tr>
  <tr>
    <td>Nguyễn Thị C</td>
    <td>50% hoàn thành</td>
    <td>50% hủy hàng</td>
  </tr>
</table>

</body>
</html>
