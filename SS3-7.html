<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sở thích của bạn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .form-container {
            border: 2px solid #add8e6; /* Màu xanh nhạt bao quanh */
            width: 800px;
            padding: 10px;
        }
        .header {
            background-color: #ff4500; /* Màu cam tiêu đề */
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .row {
            display: flex;
            margin-bottom: 10px;
            align-items: center;
        }
        .label {
            width: 100px;
            text-align: right;
            margin-right: 15px;
            color: #00008b;
        }
        input, input[type="email"] {
            width: 250px;
            padding: 3px;
        }
        .hobbies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            color: #ff6347; /* Màu cam nhạt cho chữ sở thích */
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 5px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">Sở thích của bạn</div>
    
    <form>
        <div class="row">
            <div class="label">Họ và tên</div>
            <input type="text" name="fullname">
        </div>
        
        <div class="row">
            <div class="label">Email</div>
            <input type="email" name="email" style="width: 150px;">
        </div>
        
        <div class="row">
            <div class="label">Sở thích</div>
            <div class="hobbies-grid">
                <label><input type="checkbox"> Thể thao</label>
                <label><input type="checkbox"> Âm nhạc</label>
                <label><input type="checkbox"> Đọc sách</label>
                <label><input type="checkbox"> Lướt web</label>
                <label><input type="checkbox"> Chơi game</label>
                <label><input type="checkbox"> Điện ảnh</label>
                <label><input type="checkbox"> Du lịch</label>
            </div>
        </div>

        <div class="buttons">
            <button type="submit">Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </div>
    </form>
</div>
</body>
</html>
